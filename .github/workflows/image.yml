name: image

# Builds the one-container image (Dockerfile: app + agent + keeper) and publishes it to GHCR.
# The digest printed in the job summary is what deploy/phala/docker-compose.yaml pins, so the
# code a TEE attests is a CI build of a commit, not something built on a laptop.

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, 'app/**', 'agent/twooptions_agent/**', .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Digest
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${{ github.sha }}\`. Pin this digest in deploy/phala/docker-compose.yaml." >> "$GITHUB_STEP_SUMMARY"
