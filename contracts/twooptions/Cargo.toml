[package]
name = "twooptions"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Everlasting options vault and settlement contract for NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = ">=5.10, <5.30"

[dev-dependencies]
near-sdk = { version = ">=5.10, <5.30", features = ["unit-testing"] }
ed25519-dalek = "2"
