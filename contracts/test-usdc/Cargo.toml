[package]
name = "test-usdc"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Mintable NEP-141 token with 6 decimals, for testnet only"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = ">=5.10, <5.30"
near-contract-standards = ">=5.10, <5.30"

[dev-dependencies]
near-sdk = { version = ">=5.10, <5.30", features = ["unit-testing"] }
