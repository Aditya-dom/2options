[project]
name = "twooptions-agent"
version = "0.1.0"
description = "Off-chain pieces for the 2Options NEAR contract: wire format, spot feed, vault inventory"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twooptions_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # same as the repo root config

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
